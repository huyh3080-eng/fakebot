# Cấu hình Nginx ĐẦY ĐỦ cho cp.oceandeepsmc.top – Bot Panel
# Copy toàn bộ file này vào: /etc/nginx/sites-available/cp.oceandeepsmc.top
# Rồi: sudo ln -sf /etc/nginx/sites-available/cp.oceandeepsmc.top /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
# HTTPS: sudo certbot --nginx -d cp.oceandeepsmc.top
#
# QUAN TRỌNG – tránh ERR_TOO_MANY_REDIRECTS:
# Chỉ dùng 1 location / và proxy_pass KHÔNG có dấu / sau 3000.
# Không thêm location /bot { proxy_pass .../; } (sẽ cắt path, app nhận / rồi redirect /bot → loop).

server {
    listen 80;
    server_name cp.oceandeepsmc.top;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
